name: Docker image

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=semver,pattern={{version}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            LETOPIS_CHANNEL=${{ github.ref == 'refs/heads/dev' && 'dev' || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # a GitHub release only for the round versions (1.70, 1.80, ...), once, when they reach main
  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Release a round version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')")
          case "$V" in *0) ;; *) echo "v$V is not a round version"; exit 0 ;; esac
          if gh release view "v$V" > /dev/null 2>&1; then echo "v$V already released"; exit 0; fi
          npm ci
          npx esbuild scripts/release-notes.ts --bundle --platform=node --format=esm --outfile=dist/release-notes.mjs --log-level=warning
          node dist/release-notes.mjs "$V" > notes.md
          gh release create "v$V" --title "Letopis $V" --notes-file notes.md --target "$GITHUB_SHA"
